<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Proxy Manager - Material Glass</title>
  
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PapaParse for Google Sheets CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    body { font-family: 'Roboto', sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
  </style>
</head>
<body class="flex flex-col h-screen bg-[#f3f6f9] text-gray-800 relative overflow-hidden selection:bg-blue-200">

  <!-- Ambient Animated Blobs -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-300/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob z-0 pointer-events-none print:hidden"></div>
  <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-300/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob animation-delay-2000 z-0 pointer-events-none print:hidden"></div>
  <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-cyan-300/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob animation-delay-4000 z-0 pointer-events-none print:hidden"></div>

  <!-- App Wrapper -->
  <div class="relative z-10 flex flex-col h-full w-full">
    
    <!-- Top Navbar -->
    <header class="h-16 flex items-center justify-between px-6 bg-white/60 backdrop-blur-xl border-b border-white/50 shadow-sm shrink-0 print:hidden transition-all">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-xl shadow-md shadow-blue-500/20">
          <i data-lucide="calendar-days" class="w-5 h-5 text-white"></i>
        </div>
        <h1 class="text-xl font-medium text-gray-800 tracking-tight">Proxy<span class="font-bold text-blue-600">Manager</span></h1>
      </div>
      <button id="sync-btn" onclick="fetchData()" class="flex items-center space-x-2 px-5 py-2.5 bg-white/50 hover:bg-white/80 backdrop-blur-md border border-white/60 shadow-[0_2px_10px_rgba(0,0,0,0.02)] text-gray-700 rounded-full transition-all text-sm font-medium hover:shadow-[0_4px_15px_rgba(0,0,0,0.05)]">
        <i data-lucide="refresh-cw" id="sync-icon" class="w-4 h-4 text-blue-600"></i>
        <span id="sync-text">Sync Sheets Data</span>
      </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- Left Sidebar -->
      <aside class="w-80 bg-white/40 backdrop-blur-lg border-r border-white/60 flex flex-col shrink-0 print:hidden shadow-[4px_0_24px_rgba(0,0,0,0.01)]">
        
        <!-- Day Selector -->
        <div class="p-5 border-b border-white/50">
          <h2 class="text-xs font-bold text-gray-400/80 uppercase tracking-widest mb-3 pl-1">Working Day</h2>
          <div id="day-selector-container" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Teacher List -->
        <div class="flex-1 overflow-y-auto flex flex-col">
          <div class="p-5 pb-2">
            <div class="flex items-center justify-between mb-4 pl-1">
              <h2 class="text-xs font-bold text-gray-400/80 uppercase tracking-widest">Mark Absences</h2>
              <span id="absent-badge" class="bg-blue-100/80 backdrop-blur-sm text-blue-700 py-1 px-3 rounded-full text-xs font-bold shadow-sm">0 Absent</span>
            </div>
            
            <!-- Search Bar added here -->
            <div class="relative mb-4">
              <input type="text" id="teacher-search" placeholder="Search teachers..." oninput="handleSearch(event)" class="w-full bg-white/50 border border-white/60 text-gray-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-400 focus:border-blue-400 block px-4 py-2.5 shadow-sm outline-none transition-all placeholder-gray-400">
              <i data-lucide="search" class="absolute right-3 top-2.5 w-4 h-4 text-gray-400"></i>
            </div>
          </div>
          
          <div id="teacher-list-container" class="space-y-2 px-5 pb-5"></div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 flex flex-col bg-transparent relative overflow-hidden print:bg-white">
        
        <!-- Tabs -->
        <div class="px-10 pt-8 border-b border-gray-200/50 print:hidden shrink-0">
          <div id="tabs-container" class="flex space-x-8"></div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-10 print:p-0 relative">
          <div class="max-w-6xl mx-auto print:max-w-none">
            
            <!-- Loading State -->
            <div id="loading-state" class="hidden text-center py-20">
              <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin mx-auto mb-4"></i>
              <h3 class="text-lg font-medium text-gray-700">Loading live data from Google Sheets...</h3>
            </div>

            <div id="content-wrapper">
              <!-- Header -->
              <div class="flex justify-between items-end mb-10 print:mb-4">
                <div>
                  <h2 id="view-title" class="text-3xl font-light text-gray-900 tracking-tight">Proxy Assignments</h2>
                  <p class="text-gray-500 flex items-center mt-2 font-medium">
                    <i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-500"></i>
                    <span id="view-subtitle">Schedule</span>
                  </p>
                </div>
                <div class="flex space-x-3 print:hidden">
                  <button id="copy-btn" onclick="copyMessage()" class="hidden items-center space-x-2 bg-gradient-to-br from-green-500 to-emerald-600 text-white px-5 py-2.5 rounded-full hover:shadow-lg transition-all shadow-sm hover:scale-105 border border-green-400/50">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                    <span class="font-medium text-sm">Copy Message</span>
                  </button>
                  <button id="print-btn" onclick="window.print()" class="hidden items-center space-x-2 bg-white/70 backdrop-blur-md border border-white/60 text-gray-700 px-5 py-2.5 rounded-full hover:bg-white transition-all shadow-sm hover:shadow-md">
                    <i data-lucide="printer" class="w-4 h-4 text-gray-500"></i>
                    <span class="font-medium text-sm">Print Plan</span>
                  </button>
                </div>
              </div>

              <!-- Dynamic Content Container -->
              <div id="main-content-container"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-gray-900/90 backdrop-blur-xl border border-gray-700/50 text-white px-6 py-3.5 rounded-2xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 pointer-events-none">
    <i data-lucide="check-circle-2" class="w-5 h-5 text-green-400"></i>
    <span id="toast-message" class="font-medium text-sm"></span>
  </div>

  <script>
    // --- CONFIGURATION ---
    const GOOGLE_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVv7QPddsHaKXmUGBoQpx4zDl8cHzxARXXZXzNJE5K3iCjsoqb_2yZmArZLv0qz7ydyl1XNly6GnpE/pub?output=csv";
    
    // Updated to include Saturday
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // --- DATA STORE ---
    let TEACHERS = [];
    let TIMETABLE = {};

    let state = {
      selectedDay: DAYS[0],
      absentTeachers: [],
      activeTab: 'assign', 
      assignments: {}, 
      isSyncing: false,
      searchQuery: '' // Added for search functionality
    };

    // --- DATA FETCHING (GOOGLE SHEETS) ---
    function fetchData() {
      if (state.isSyncing) return;
      state.isSyncing = true;
      
      const icon = document.getElementById('sync-icon');
      const text = document.getElementById('sync-text');
      icon.classList.add('animate-spin');
      text.innerText = 'Syncing...';
      
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('content-wrapper').classList.add('hidden');

      Papa.parse(GOOGLE_SHEETS_CSV, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          console.log("Raw Google Sheets Data:", results.data);
          
          TEACHERS = [];
          TIMETABLE = {};
          state.assignments = {}; // Reset assignments on data sync
          
          results.data.forEach(row => {
            // Support multiple possible column headers
            const name = row['NAME OF TEACHER'] || row['Teacher'] || row['Teacher Name'] || row['Name'];
            const subject = row['CLASS ALLOTED'] || row['Subject'] || 'No Subject';
            // FIX: Added 'DAY' to support uppercase columns from your Google Sheet
            let day = row['DAY'] || row['Day'] || row['Weekday'] || row['day'];

            if (!name) return; // Skip empty rows

            const id = name.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');

            // Add teacher to master list
            if (!TEACHERS.find(t => t.id === id)) {
              TEACHERS.push({ id: id, name: name.trim(), subject: subject.trim() });
            }

            // Initialize their timetable framework for the whole week
            if (!TIMETABLE[id]) {
              TIMETABLE[id] = {};
              DAYS.forEach(d => {
                TIMETABLE[id][d] = [null, null, null, null, null, null, null];
              });
            }

            // Parse Periods 1-7
            const schedule = [];
            for (let i = 1; i <= 7; i++) {
              let val = row[`Period ${i}`] || row[`Period${i}`] || row[i.toString()] || row[`P${i}`];
              if (val === undefined || val === null) {
                val = null;
              } else {
                val = val.trim();
                // Treat empty spaces, hyphens, or 'free' as null
                if (val === '' || val.toLowerCase() === 'free' || val === '-') val = null;
              }
              schedule.push(val);
            }

            // Assign schedule to the specific day
            if (day) {
              const formattedDay = day.trim().charAt(0).toUpperCase() + day.trim().slice(1).toLowerCase();
              if (DAYS.includes(formattedDay)) {
                TIMETABLE[id][formattedDay] = schedule;
              }
            } else {
              // Only fallback to Monday if the DAY column is truly missing
              TIMETABLE[id]['Monday'] = schedule;
            }
          });

          // Finish Loading
          state.isSyncing = false;
          icon.classList.remove('animate-spin');
          text.innerText = 'Sync Sheets Data';
          document.getElementById('loading-state').classList.add('hidden');
          document.getElementById('content-wrapper').classList.remove('hidden');
          
          renderApp();
        },
        error: function(err) {
          console.error("Error fetching data:", err);
          alert("Failed to connect to Google Sheets. Check if the link is published to the web.");
          state.isSyncing = false;
          icon.classList.remove('animate-spin');
          text.innerText = 'Sync Sheets Data';
        }
      });
    }

    // --- HELPER LOGIC ---
    function getAvailableProxies(day, periodIndex, currentAbsentId) {
      return TEACHERS.filter(teacher => {
        if (state.absentTeachers.includes(teacher.id)) return false;
        
        // Ensure timetable object exists to prevent errors
        if (TIMETABLE[teacher.id] && TIMETABLE[teacher.id][day]) {
          if (TIMETABLE[teacher.id][day][periodIndex] !== null) return false;
        }

        const isAssignedElsewhere = Object.entries(state.assignments).some(([key, assignedProxyId]) => {
          const [assnDay, assnAbsentId, assnPeriod] = key.split('-');
          return assnDay === day && parseInt(assnPeriod) === periodIndex && assignedProxyId === teacher.id && assnAbsentId !== currentAbsentId;
        });
        if (isAssignedElsewhere) return false;
        
        return true;
      });
    }

    function generateSummaryData() {
      let data = [];
      state.absentTeachers.forEach(absentId => {
        const teacher = TEACHERS.find(t => t.id === absentId);
        
        if (TIMETABLE[absentId] && TIMETABLE[absentId][state.selectedDay]) {
          const daySchedule = TIMETABLE[absentId][state.selectedDay];
          
          daySchedule.forEach((className, index) => {
            if (className) {
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const proxyId = state.assignments[assignmentKey];
              const proxyTeacher = TEACHERS.find(t => t.id === proxyId);
              
              data.push({
                period: index + 1,
                className,
                absentTeacher: teacher,
                proxyTeacher: proxyTeacher || null,
                status: proxyId ? 'Covered' : 'Pending'
              });
            }
          });
        }
      });
      return data.sort((a, b) => a.period - b.period);
    }

    function generateProxyMessage() {
      let message = "PROXY\n";
      
      // Formatting the Date dynamically (e.g., "15 July 26")
      const date = new Date();
      const day = date.getDate();
      const month = date.toLocaleString('default', { month: 'long' });
      const year = date.getFullYear().toString().slice(-2);
      
      message += `${day} ${month} ${year}, ${state.selectedDay}\n\n`;

      let hasData = false;
      const ordinals = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"];

      state.absentTeachers.forEach(absentId => {
        const teacher = TEACHERS.find(t => t.id === absentId);
        
        if (TIMETABLE[absentId] && TIMETABLE[absentId][state.selectedDay]) {
          const daySchedule = TIMETABLE[absentId][state.selectedDay];
          let teacherMessage = "";
          let hasClasses = false;

          daySchedule.forEach((className, index) => {
            if (className) {
              hasClasses = true;
              const period = index + 1;
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const proxyId = state.assignments[assignmentKey];
              const proxyTeacher = TEACHERS.find(t => t.id === proxyId);
              const proxyName = proxyTeacher ? proxyTeacher.name : "Unassigned";
              
              const periodStr = ordinals[period] || period + "th";
              teacherMessage += `${periodStr} period ${className} - ${proxyName}\n`;
            }
          });

          if (hasClasses) {
            message += `${teacher.name}\n${teacherMessage}\n`;
            hasData = true;
          }
        }
      });

      if (!hasData) {
        message += "No proxies assigned for today.\n";
      }

      return message;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // --- EVENT HANDLERS ---
    window.handleSearch = function(e) {
      state.searchQuery = e.target.value.toLowerCase();
      renderSidebar();
    };

    window.setSelectedDay = function(day) {
      state.selectedDay = day;
      renderApp();
    };

    window.toggleAbsent = function(teacherId) {
      if (state.absentTeachers.includes(teacherId)) {
        state.absentTeachers = state.absentTeachers.filter(id => id !== teacherId);
      } else {
        state.absentTeachers.push(teacherId);
      }
      renderApp();
    };

    window.setActiveTab = function(tab) {
      state.activeTab = tab;
      renderApp();
    };

    window.assignProxy = function(selectElement, absentId, periodIndex) {
      const proxyId = selectElement.value;
      const key = `${state.selectedDay}-${absentId}-${periodIndex}`;
      
      if (proxyId) {
        state.assignments[key] = proxyId;
      } else {
        delete state.assignments[key];
      }
      renderApp(); 
    };

    window.copyMessage = function() {
      const text = generateProxyMessage();
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast("WhatsApp Message copied to clipboard!");
      } catch (err) {
        console.error('Failed to copy', err);
        showToast("Failed to copy message.");
      }
      document.body.removeChild(textArea);
    };

    // --- RENDER FUNCTIONS ---
    function renderSidebar() {
      // 1. Day Selector
      const dayContainer = document.getElementById('day-selector-container');
      dayContainer.innerHTML = DAYS.map(day => `
        <button onclick="setSelectedDay('${day}')" class="px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all duration-200 ${
          state.selectedDay === day 
          ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30 transform scale-105' 
          : 'bg-white/50 text-gray-600 border border-white/60 hover:bg-white/80 hover:shadow-sm'
        }">${day.slice(0, 3)}</button>
      `).join('');

      // 2. Teacher List with Search Filter
      document.getElementById('absent-badge').innerText = `${state.absentTeachers.length} Absent`;
      
      const teacherContainer = document.getElementById('teacher-list-container');
      
      const filteredTeachers = TEACHERS.filter(t => 
        t.name.toLowerCase().includes(state.searchQuery) || 
        t.subject.toLowerCase().includes(state.searchQuery)
      );

      if (filteredTeachers.length === 0 && TEACHERS.length > 0) {
        teacherContainer.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">No teachers found.</p>`;
      } else {
        teacherContainer.innerHTML = filteredTeachers.map(teacher => {
          const isAbsent = state.absentTeachers.includes(teacher.id);
          return `
            <button onclick="toggleAbsent('${teacher.id}')" class="w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all duration-200 text-left ${
              isAbsent 
              ? 'bg-red-50/80 backdrop-blur-md border-red-200/60 shadow-[0_4px_12px_rgba(239,68,68,0.08)] transform scale-[1.02]' 
              : 'bg-white/30 border-transparent hover:border-white/60 hover:bg-white/60 hover:shadow-sm'
            }">
              <div class="flex flex-col">
                <span class="font-medium text-sm ${isAbsent ? 'text-red-700' : 'text-gray-700'}">${teacher.name}</span>
                <span class="text-xs ${isAbsent ? 'text-red-400' : 'text-gray-500'} mt-0.5 truncate max-w-[180px]">${teacher.subject}</span>
              </div>
              ${isAbsent 
                ? `<i data-lucide="user-minus" class="w-5 h-5 text-red-500 shrink-0"></i>` 
                : `<div class="w-5 h-5 rounded-full border-2 border-gray-300/50 bg-white/50 shrink-0"></div>`
              }
            </button>
          `;
        }).join('');
      }
      lucide.createIcons();
    }

    function renderTabsAndHeader() {
      const summaryData = generateSummaryData();
      const pendingCount = summaryData.filter(d => d.status === 'Pending').length;
      
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = `
        <button onclick="setActiveTab('assign')" class="pb-3 flex items-center space-x-2 border-b-2 font-medium transition-all duration-200 ${
          state.activeTab === 'assign' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-800'
        }">
          <i data-lucide="layout-dashboard" class="w-4 h-4 ${state.activeTab === 'assign' ? 'text-blue-600' : ''}"></i>
          <span>Assign Proxies</span>
        </button>
        <button onclick="setActiveTab('summary')" class="pb-3 flex items-center space-x-2 border-b-2 font-medium transition-all duration-200 relative ${
          state.activeTab === 'summary' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-800'
        }">
          <i data-lucide="clipboard-list" class="w-4 h-4 ${state.activeTab === 'summary' ? 'text-blue-600' : ''}"></i>
          <span>Daily Summary</span>
          ${pendingCount > 0 ? `
            <span class="flex h-2.5 w-2.5 relative ml-1 -mt-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 border border-white"></span>
            </span>
          ` : ''}
        </button>
      `;

      document.getElementById('view-title').innerText = state.activeTab === 'assign' ? 'Proxy Assignments' : 'Action Plan';
      document.getElementById('view-subtitle').innerText = `${state.selectedDay} Schedule`;
      
      const printBtn = document.getElementById('print-btn');
      const copyBtn = document.getElementById('copy-btn');
      
      if (state.activeTab === 'summary') {
        printBtn.classList.remove('hidden');
        printBtn.classList.add('flex');
        copyBtn.classList.remove('hidden');
        copyBtn.classList.add('flex');
      } else {
        printBtn.classList.add('hidden');
        printBtn.classList.remove('flex');
        copyBtn.classList.add('hidden');
        copyBtn.classList.remove('flex');
      }
      lucide.createIcons();
    }

    function renderMainContent() {
      const container = document.getElementById('main-content-container');
      
      if (TEACHERS.length === 0) {
        container.innerHTML = `
          <div class="text-center py-24 bg-white/40 backdrop-blur-xl rounded-3xl border border-white/60 shadow-[0_8px_32px_rgba(0,0,0,0.04)]">
             <i data-lucide="database" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
             <h3 class="text-xl font-medium text-gray-800">No Data Loaded</h3>
             <p class="text-gray-500 mt-2">Click 'Sync Sheets Data' above to load your teachers.</p>
          </div>
        `;
        return;
      }

      if (state.activeTab === 'assign') {
        if (state.absentTeachers.length === 0) {
          container.innerHTML = `
            <div class="text-center py-24 bg-white/40 backdrop-blur-xl rounded-3xl border border-white/60 shadow-[0_8px_32px_rgba(0,0,0,0.04)]">
              <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-50/80 mb-5 shadow-inner">
                <i data-lucide="users" class="w-10 h-10 text-blue-500"></i>
              </div>
              <h3 class="text-xl font-medium text-gray-800">No Absences Marked</h3>
              <p class="text-gray-500 max-w-sm mx-auto mt-3 leading-relaxed">Select teachers from the left sidebar to mark them as absent and begin assigning proxies.</p>
            </div>
          `;
        } else {
          let html = `<div class="grid grid-cols-1 xl:grid-cols-2 gap-8">`;
          
          state.absentTeachers.forEach(absentId => {
            const teacher = TEACHERS.find(t => t.id === absentId);
            const schedule = TIMETABLE[absentId][state.selectedDay] || [null,null,null,null,null,null,null];
            
            html += `
              <div class="bg-white/60 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/70 overflow-hidden transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
                <div class="px-6 py-5 border-b border-white/50 bg-white/40 flex items-center justify-between">
                  <div class="flex items-center space-x-4">
                    <div class="bg-red-500/10 text-red-500 p-2.5 rounded-xl">
                      <i data-lucide="alert-circle" class="w-5 h-5"></i>
                    </div>
                    <div class="overflow-hidden">
                      <h3 class="font-medium text-lg text-gray-800 truncate">${teacher.name}</h3>
                      <p class="text-sm text-gray-500 truncate max-w-[200px]">${teacher.subject}</p>
                    </div>
                  </div>
                </div>
                <div class="divide-y divide-gray-100/50 p-2">
            `;

            schedule.forEach((className, index) => {
              const isFree = className === null;
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const currentProxyId = state.assignments[assignmentKey] || '';
              const availableProxies = isFree ? [] : getAvailableProxies(state.selectedDay, index, absentId);

              html += `
                <div class="px-4 py-3.5 flex items-center justify-between hover:bg-white/40 rounded-xl transition-colors">
                  <div class="flex items-center space-x-4 w-1/3">
                    <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-gray-100/80 text-gray-600 font-medium text-sm shadow-inner shrink-0">P${index + 1}</span>
                    ${isFree 
                      ? `<span class="text-sm text-gray-400 italic flex items-center whitespace-nowrap"><i data-lucide="coffee" class="w-4 h-4 mr-2 opacity-60"></i> Free</span>` 
                      : `<span class="font-medium text-gray-800 bg-blue-50/50 border border-blue-100/50 px-3.5 py-1.5 rounded-lg text-sm truncate max-w-[120px]" title="${className}">Class ${className}</span>`
                    }
                  </div>
                  
                  <div class="flex-1 flex justify-end">
                    ${isFree ? `<span class="text-sm text-gray-400">No proxy needed</span>` : `
                      <div class="relative w-full max-w-[220px]">
                        <select onchange="assignProxy(this, '${absentId}', ${index})" class="w-full appearance-none bg-white/70 backdrop-blur-sm border ${currentProxyId ? 'border-green-300 ring-2 ring-green-100' : 'border-white/80'} text-gray-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-400 focus:border-blue-400 block px-4 py-2.5 shadow-sm cursor-pointer outline-none transition-all hover:bg-white">
                          <option value="">Select proxy...</option>
                          ${availableProxies.map(proxy => `
                            <option value="${proxy.id}" ${proxy.id === currentProxyId ? 'selected' : ''}>
                              ${proxy.name}
                            </option>
                          `).join('')}
                          ${currentProxyId && !availableProxies.find(p => p.id === currentProxyId) ? `
                            <option value="${currentProxyId}" selected>${TEACHERS.find(t=>t.id===currentProxyId).name} (Selected)</option>
                          ` : ''}
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                          <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                      </div>
                    `}
                  </div>

                  <div class="w-10 flex justify-end">
                    ${currentProxyId && !isFree ? `<i data-lucide="check-circle-2" class="w-5 h-5 text-green-500 drop-shadow-sm"></i>` : ''}
                  </div>
                </div>
              `;
            });

            html += `</div></div>`;
          });
          html += `</div>`;
          container.innerHTML = html;
        }

      } else if (state.activeTab === 'summary') {
        const summaryData = generateSummaryData();
        
        if (summaryData.length === 0) {
          container.innerHTML = `
            <div class="bg-white/40 backdrop-blur-xl rounded-3xl border border-white/60 shadow-sm print:border-none print:shadow-none p-16 text-center text-gray-500 text-lg">
              No classes require coverage for ${state.selectedDay}.
            </div>
          `;
        } else {
          let html = `
            <div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.03)] border border-white/60 overflow-hidden print:border-none print:shadow-none">
              <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-600">
                  <thead class="text-xs text-gray-500/80 uppercase tracking-wider bg-white/40 border-b border-white/60 print:bg-white print:text-gray-800">
                    <tr>
                      <th class="px-8 py-5 font-medium">Period</th>
                      <th class="px-8 py-5 font-medium">Class</th>
                      <th class="px-8 py-5 font-medium">Absent Teacher</th>
                      <th class="px-8 py-5 font-medium">Assigned Proxy</th>
                      <th class="px-8 py-5 font-medium text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-100/50">
          `;

          summaryData.forEach(row => {
            html += `
              <tr class="hover:bg-white/50 transition-colors print:border-b print:border-gray-300 print:hover:bg-white print:break-inside-avoid">
                <td class="px-8 py-5 font-medium text-gray-800">Period ${row.period}</td>
                <td class="px-8 py-5"><span class="bg-gray-100/80 text-gray-700 px-3 py-1.5 rounded-lg font-medium shadow-inner print:bg-transparent print:px-0 print:text-black">${row.className}</span></td>
                <td class="px-8 py-5">
                  <div class="flex flex-col">
                    <span class="font-medium text-gray-800">${row.absentTeacher.name}</span>
                    <span class="text-xs text-gray-500 mt-0.5 truncate max-w-[200px]">${row.absentTeacher.subject}</span>
                  </div>
                </td>
                <td class="px-8 py-5">
                  ${row.proxyTeacher ? `
                    <div class="flex flex-col">
                      <span class="font-medium text-blue-700 print:text-black">${row.proxyTeacher.name}</span>
                      <span class="text-xs text-blue-400/80 mt-0.5 print:text-gray-500 truncate max-w-[200px]">${row.proxyTeacher.subject}</span>
                    </div>
                  ` : `<span class="text-red-400 font-medium italic print:text-black">Unassigned</span>`}
                </td>
                <td class="px-8 py-5 text-right">
                  ${row.status === 'Covered' ? `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100/80 text-green-700 border border-green-200/50 print:bg-transparent print:text-black print:px-0 print:border-none">
                      <i data-lucide="check" class="w-3.5 h-3.5 mr-1.5 print:hidden"></i> Covered
                    </span>
                  ` : `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-50 text-red-600 border border-red-100 print:bg-transparent print:text-black print:px-0 print:border-gray-400 print:rounded-none">
                      Pending
                    </span>
                  `}
                </td>
              </tr>
            `;
          });

          html += `</tbody></table></div></div>`;
          container.innerHTML = html;
        }
      }
      lucide.createIcons();
    }

    // --- MASTER RENDER FUNCTION ---
    function renderApp() {
      renderSidebar();
      renderTabsAndHeader();
      renderMainContent();
    }

    // --- INITIALIZE ---
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-fetch data when the page loads
      fetchData();
    });
  </script>
</body>
</html>
