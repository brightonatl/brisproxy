<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Proxy Manager - Material Glass</title>
  
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PapaParse for Google Sheets CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    body { font-family: 'Roboto', sans-serif; }
    
    /* Elegant thin scrollbar for bento cards */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Hide scrollbar for horizontal tabs on mobile */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F0F4F8] text-slate-800 h-screen flex flex-col font-['Roboto'] selection:bg-blue-200">

  <!-- Main Bento Grid Wrapper -->
  <div class="flex-1 flex flex-col lg:flex-row gap-4 p-4 lg:p-6 lg:overflow-hidden max-w-[1600px] mx-auto w-full h-full overflow-y-auto">
    
    <!-- Left Column (Bento Cards) -->
    <div class="w-full lg:w-[400px] flex flex-col gap-4 shrink-0 lg:overflow-hidden h-fit lg:h-full print:hidden">
      
      <!-- Header Card -->
      <div class="bg-white rounded-[28px] p-5 flex items-center justify-between shrink-0 shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2.5 rounded-[16px] shadow-sm">
            <i data-lucide="calendar-days" class="w-5 h-5 text-white"></i>
          </div>
          <h1 class="text-xl font-medium text-slate-800 tracking-tight">Proxy<span class="font-bold text-blue-600">Manager</span></h1>
        </div>
        <button id="sync-btn" onclick="fetchData()" class="flex items-center justify-center p-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-full transition-colors" title="Sync Data">
          <i data-lucide="refresh-cw" id="sync-icon" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Day Selector Card -->
      <div class="bg-white rounded-[28px] p-6 shrink-0 shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 pl-1">Working Day</h2>
        <div id="day-selector-container" class="flex overflow-x-auto hide-scrollbar gap-2 pb-1"></div>
      </div>

      <!-- Absences Card -->
      <div class="bg-white rounded-[28px] p-6 flex flex-col flex-1 min-h-[450px] lg:overflow-hidden shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-5 pl-1 shrink-0">
          <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Mark Absences</h2>
          <span id="absent-badge" class="bg-red-100 text-red-700 py-1 px-3 rounded-full text-xs font-bold">0 Absent</span>
        </div>
        
        <!-- Search Bar -->
        <div class="relative mb-5 shrink-0">
          <input type="text" id="teacher-search" placeholder="Search teachers..." oninput="handleSearch(event)" class="w-full bg-slate-100 border-transparent text-slate-700 text-base rounded-full focus:ring-2 focus:ring-blue-500 focus:bg-white block px-5 py-3.5 transition-all placeholder-slate-400 outline-none">
          <i data-lucide="search" class="absolute right-4 top-3.5 w-5 h-5 text-slate-400"></i>
        </div>
        
        <!-- Teacher List -->
        <div id="teacher-list-container" class="space-y-2 overflow-y-auto flex-1 hide-scrollbar -mx-2 px-2 pb-4"></div>
      </div>
    </div>

    <!-- Right Column (Main Content Card) -->
    <main class="flex-1 flex flex-col bg-white rounded-[28px] lg:overflow-hidden shadow-sm border border-slate-100 h-full min-h-[600px] print:shadow-none print:border-none print:rounded-none">
      
      <!-- Tabs Header -->
      <div class="px-6 md:px-8 pt-6 border-b border-slate-100 print:hidden shrink-0 overflow-x-auto hide-scrollbar">
        <div id="tabs-container" class="flex space-x-6 min-w-max"></div>
      </div>

      <!-- Scrollable Workspace -->
      <div class="flex-1 overflow-y-auto p-6 md:p-8 print:p-0 relative bg-slate-50/30">
        
        <!-- Loading State -->
        <div id="loading-state" class="hidden text-center py-24">
          <i data-lucide="loader-2" class="w-12 h-12 text-blue-600 animate-spin mx-auto mb-4"></i>
          <h3 class="text-xl font-medium text-slate-700">Loading live data...</h3>
          <p class="text-slate-500 mt-2">Fetching from Google Sheets</p>
        </div>

        <div id="content-wrapper">
          <!-- View Header -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0 mb-8 print:mb-4">
            <div>
              <h2 id="view-title" class="text-2xl md:text-3xl font-medium text-slate-800 tracking-tight">Proxy Assignments</h2>
              <p class="text-slate-500 flex items-center mt-1.5 font-medium text-sm">
                <i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-600"></i>
                <span id="view-subtitle">Schedule</span>
              </p>
            </div>
            <div class="flex space-x-3 print:hidden w-full sm:w-auto">
              <button id="copy-btn" onclick="copyMessage()" class="hidden flex-1 sm:flex-none items-center justify-center space-x-2 bg-blue-600 text-white px-5 py-2.5 rounded-full hover:bg-blue-700 transition-colors shadow-sm font-medium text-sm">
                <i data-lucide="copy" class="w-4 h-4"></i>
                <span>Copy Message</span>
              </button>
              <button id="print-btn" onclick="window.print()" class="hidden flex-1 sm:flex-none items-center justify-center space-x-2 bg-slate-100 text-slate-700 px-5 py-2.5 rounded-full hover:bg-slate-200 transition-colors font-medium text-sm">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Print</span>
              </button>
            </div>
          </div>

          <!-- Dynamic Content Container -->
          <div id="main-content-container"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3.5 rounded-full shadow-lg translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 pointer-events-none">
    <i data-lucide="check-circle-2" class="w-5 h-5 text-green-400"></i>
    <span id="toast-message" class="font-medium text-sm"></span>
  </div>

  <script>
    // --- CONFIGURATION ---
    const GOOGLE_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVv7QPddsHaKXmUGBoQpx4zDl8cHzxARXXZXzNJE5K3iCjsoqb_2yZmArZLv0qz7ydyl1XNly6GnpE/pub?output=csv";
    
    // Updated to include Saturday
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // --- DATA STORE ---
    let TEACHERS = [];
    let TIMETABLE = {};

    let state = {
      selectedDay: DAYS[0],
      absentTeachers: [],
      activeTab: 'assign', 
      assignments: {}, 
      isSyncing: false,
      searchQuery: '' // Added for search functionality
    };

    // --- DATA FETCHING (GOOGLE SHEETS) ---
    function fetchData() {
      if (state.isSyncing) return;
      state.isSyncing = true;
      
      const icon = document.getElementById('sync-icon');
      icon.classList.add('animate-spin');
      
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('content-wrapper').classList.add('hidden');

      Papa.parse(GOOGLE_SHEETS_CSV, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          console.log("Raw Google Sheets Data:", results.data);
          
          TEACHERS = [];
          TIMETABLE = {};
          state.assignments = {}; // Reset assignments on data sync
          
          results.data.forEach(row => {
            // Support multiple possible column headers
            const name = row['NAME OF TEACHER'] || row['Teacher'] || row['Teacher Name'] || row['Name'];
            const subject = row['CLASS ALLOTED'] || row['Subject'] || 'No Subject';
            // FIX: Added 'DAY' to support uppercase columns from your Google Sheet
            let day = row['DAY'] || row['Day'] || row['Weekday'] || row['day'];

            if (!name) return; // Skip empty rows

            const id = name.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');

            // Add teacher to master list
            if (!TEACHERS.find(t => t.id === id)) {
              TEACHERS.push({ id: id, name: name.trim(), subject: subject.trim() });
            }

            // Initialize their timetable framework for the whole week
            if (!TIMETABLE[id]) {
              TIMETABLE[id] = {};
              DAYS.forEach(d => {
                TIMETABLE[id][d] = [null, null, null, null, null, null, null];
              });
            }

            // Parse Periods 1-7
            const schedule = [];
            for (let i = 1; i <= 7; i++) {
              let val = row[`Period ${i}`] || row[`Period${i}`] || row[i.toString()] || row[`P${i}`];
              if (val === undefined || val === null) {
                val = null;
              } else {
                val = val.trim();
                // Treat empty spaces, hyphens, or 'free' as null
                if (val === '' || val.toLowerCase() === 'free' || val === '-') val = null;
              }
              schedule.push(val);
            }

            // Assign schedule to the specific day
            if (day) {
              const formattedDay = day.trim().charAt(0).toUpperCase() + day.trim().slice(1).toLowerCase();
              if (DAYS.includes(formattedDay)) {
                TIMETABLE[id][formattedDay] = schedule;
              }
            } else {
              // Only fallback to Monday if the DAY column is truly missing
              TIMETABLE[id]['Monday'] = schedule;
            }
          });

          // Finish Loading
          state.isSyncing = false;
          icon.classList.remove('animate-spin');
          document.getElementById('loading-state').classList.add('hidden');
          document.getElementById('content-wrapper').classList.remove('hidden');
          
          renderApp();
        },
        error: function(err) {
          console.error("Error fetching data:", err);
          alert("Failed to connect to Google Sheets. Check if the link is published to the web.");
          state.isSyncing = false;
          icon.classList.remove('animate-spin');
        }
      });
    }

    // --- HELPER LOGIC ---
    function getAvailableProxies(day, periodIndex, currentAbsentId) {
      return TEACHERS.filter(teacher => {
        if (state.absentTeachers.includes(teacher.id)) return false;
        
        // Ensure timetable object exists to prevent errors
        if (TIMETABLE[teacher.id] && TIMETABLE[teacher.id][day]) {
          if (TIMETABLE[teacher.id][day][periodIndex] !== null) return false;
        }

        const isAssignedElsewhere = Object.entries(state.assignments).some(([key, assignedProxyId]) => {
          const [assnDay, assnAbsentId, assnPeriod] = key.split('-');
          return assnDay === day && parseInt(assnPeriod) === periodIndex && assignedProxyId === teacher.id && assnAbsentId !== currentAbsentId;
        });
        if (isAssignedElsewhere) return false;
        
        return true;
      });
    }

    function generateSummaryData() {
      let data = [];
      state.absentTeachers.forEach(absentId => {
        const teacher = TEACHERS.find(t => t.id === absentId);
        
        if (TIMETABLE[absentId] && TIMETABLE[absentId][state.selectedDay]) {
          const daySchedule = TIMETABLE[absentId][state.selectedDay];
          
          daySchedule.forEach((className, index) => {
            if (className) {
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const proxyId = state.assignments[assignmentKey];
              const proxyTeacher = TEACHERS.find(t => t.id === proxyId);
              
              data.push({
                period: index + 1,
                className,
                absentTeacher: teacher,
                proxyTeacher: proxyTeacher || null,
                status: proxyId ? 'Covered' : 'Pending'
              });
            }
          });
        }
      });
      return data.sort((a, b) => a.period - b.period);
    }

    function generateProxyMessage() {
      let message = "PROXY\n";
      
      // Formatting the Date dynamically (e.g., "15 July 26")
      const date = new Date();
      const day = date.getDate();
      const month = date.toLocaleString('default', { month: 'long' });
      const year = date.getFullYear().toString().slice(-2);
      
      message += `${day} ${month} ${year}, ${state.selectedDay}\n\n`;

      let hasData = false;
      const ordinals = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"];

      state.absentTeachers.forEach(absentId => {
        const teacher = TEACHERS.find(t => t.id === absentId);
        
        if (TIMETABLE[absentId] && TIMETABLE[absentId][state.selectedDay]) {
          const daySchedule = TIMETABLE[absentId][state.selectedDay];
          let teacherMessage = "";
          let hasClasses = false;

          daySchedule.forEach((className, index) => {
            if (className) {
              hasClasses = true;
              const period = index + 1;
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const proxyId = state.assignments[assignmentKey];
              const proxyTeacher = TEACHERS.find(t => t.id === proxyId);
              const proxyName = proxyTeacher ? proxyTeacher.name : "Unassigned";
              
              const periodStr = ordinals[period] || period + "th";
              teacherMessage += `${periodStr} period ${className} - ${proxyName}\n`;
            }
          });

          if (hasClasses) {
            message += `${teacher.name}\n${teacherMessage}\n`;
            hasData = true;
          }
        }
      });

      if (!hasData) {
        message += "No proxies assigned for today.\n";
      }

      return message;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // --- EVENT HANDLERS ---
    
    window.handleSearch = function(e) {
      state.searchQuery = e.target.value.toLowerCase();
      renderSidebar();
    };

    window.setSelectedDay = function(day) {
      state.selectedDay = day;
      renderApp();
    };

    window.toggleAbsent = function(teacherId) {
      if (state.absentTeachers.includes(teacherId)) {
        state.absentTeachers = state.absentTeachers.filter(id => id !== teacherId);
      } else {
        state.absentTeachers.push(teacherId);
      }
      renderApp();
    };

    window.setActiveTab = function(tab) {
      state.activeTab = tab;
      renderApp();
    };

    window.assignProxy = function(selectElement, absentId, periodIndex) {
      const proxyId = selectElement.value;
      const key = `${state.selectedDay}-${absentId}-${periodIndex}`;
      
      if (proxyId) {
        state.assignments[key] = proxyId;
      } else {
        delete state.assignments[key];
      }
      renderApp(); 
    };

    window.copyMessage = function() {
      const text = generateProxyMessage();
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast("WhatsApp Message copied to clipboard!");
      } catch (err) {
        console.error('Failed to copy', err);
        showToast("Failed to copy message.");
      }
      document.body.removeChild(textArea);
    };

    // --- RENDER FUNCTIONS ---
    function renderSidebar() {
      // 1. Day Selector (Material segmented buttons/pills)
      const dayContainer = document.getElementById('day-selector-container');
      dayContainer.innerHTML = DAYS.map(day => `
        <button onclick="setSelectedDay('${day}')" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all whitespace-nowrap ${
          state.selectedDay === day 
          ? 'bg-blue-100 text-blue-800' 
          : 'bg-transparent text-slate-600 hover:bg-slate-100'
        }">${day.slice(0, 3)}</button>
      `).join('');

      // 2. Teacher List (Material list items)
      document.getElementById('absent-badge').innerText = `${state.absentTeachers.length} Absent`;
      
      const teacherContainer = document.getElementById('teacher-list-container');
      const filteredTeachers = TEACHERS.filter(t => 
        t.name.toLowerCase().includes(state.searchQuery) || 
        t.subject.toLowerCase().includes(state.searchQuery)
      );

      if (filteredTeachers.length === 0 && TEACHERS.length > 0) {
        teacherContainer.innerHTML = `<p class="text-slate-400 text-sm text-center py-6">No teachers found.</p>`;
      } else {
        teacherContainer.innerHTML = filteredTeachers.map(teacher => {
          const isAbsent = state.absentTeachers.includes(teacher.id);
          const initials = teacher.name.split(' ').map(n => n[0]).join('').substring(0, 2);
          
          return `
            <button onclick="toggleAbsent('${teacher.id}')" class="w-full flex items-center justify-between p-3 rounded-[20px] transition-all duration-200 text-left ${
              isAbsent 
              ? 'bg-red-50 hover:bg-red-100' 
              : 'bg-transparent hover:bg-slate-100'
            }">
              <div class="flex items-center space-x-4">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold shrink-0 ${isAbsent ? 'bg-red-200 text-red-700' : 'bg-slate-200 text-slate-600'}">
                  ${initials}
                </div>
                <div class="flex flex-col overflow-hidden">
                  <span class="font-medium text-sm truncate ${isAbsent ? 'text-red-800' : 'text-slate-800'}">${teacher.name}</span>
                  <span class="text-xs truncate ${isAbsent ? 'text-red-500' : 'text-slate-500'} mt-0.5">${teacher.subject}</span>
                </div>
              </div>
              <div class="w-6 h-6 shrink-0 flex items-center justify-center">
                ${isAbsent 
                  ? `<i data-lucide="check" class="w-5 h-5 text-red-600"></i>` 
                  : `<div class="w-5 h-5 rounded-full border-2 border-slate-300"></div>`
                }
              </div>
            </button>
          `;
        }).join('');
      }
      lucide.createIcons();
    }

    function renderTabsAndHeader() {
      const summaryData = generateSummaryData();
      const pendingCount = summaryData.filter(d => d.status === 'Pending').length;
      
      // Material underline tabs
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = `
        <button onclick="setActiveTab('assign')" class="pb-4 px-2 flex items-center space-x-2 border-b-2 font-medium transition-colors text-sm ${
          state.activeTab === 'assign' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-t-lg'
        }">
          <i data-lucide="layout-dashboard" class="w-4 h-4 ${state.activeTab === 'assign' ? 'text-blue-600' : ''}"></i>
          <span>Assign Proxies</span>
        </button>
        <button onclick="setActiveTab('summary')" class="pb-4 px-2 flex items-center space-x-2 border-b-2 font-medium transition-colors text-sm relative ${
          state.activeTab === 'summary' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-t-lg'
        }">
          <i data-lucide="clipboard-list" class="w-4 h-4 ${state.activeTab === 'summary' ? 'text-blue-600' : ''}"></i>
          <span>Daily Summary</span>
          ${pendingCount > 0 ? `
            <span class="flex h-2 w-2 relative ml-1 -mt-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
            </span>
          ` : ''}
        </button>
      `;

      document.getElementById('view-title').innerText = state.activeTab === 'assign' ? 'Proxy Assignments' : 'Action Plan';
      document.getElementById('view-subtitle').innerText = `${state.selectedDay} Schedule`;
      
      const printBtn = document.getElementById('print-btn');
      const copyBtn = document.getElementById('copy-btn');
      
      if (state.activeTab === 'summary') {
        printBtn.classList.remove('hidden');
        printBtn.classList.add('flex');
        copyBtn.classList.remove('hidden');
        copyBtn.classList.add('flex');
      } else {
        printBtn.classList.add('hidden');
        printBtn.classList.remove('flex');
        copyBtn.classList.add('hidden');
        copyBtn.classList.remove('flex');
      }
      lucide.createIcons();
    }

    function renderMainContent() {
      const container = document.getElementById('main-content-container');
      
      if (TEACHERS.length === 0) {
        container.innerHTML = `
          <div class="text-center py-24 bg-white rounded-[24px] border border-slate-100 shadow-sm">
             <i data-lucide="database" class="w-12 h-12 text-slate-300 mx-auto mb-4"></i>
             <h3 class="text-lg font-medium text-slate-700">No Data Loaded</h3>
             <p class="text-slate-500 mt-2 text-sm">Click 'Sync Data' to load teachers from Google Sheets.</p>
          </div>
        `;
        return;
      }

      if (state.activeTab === 'assign') {
        if (state.absentTeachers.length === 0) {
          container.innerHTML = `
            <div class="text-center py-24 bg-white rounded-[28px] border border-slate-100 shadow-sm">
              <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-50 mb-5">
                <i data-lucide="user-check" class="w-10 h-10 text-blue-600"></i>
              </div>
              <h3 class="text-xl font-medium text-slate-800">All Teachers Present</h3>
              <p class="text-slate-500 max-w-sm mx-auto mt-3 text-sm leading-relaxed">Select teachers from the "Mark Absences" list to begin assigning proxies.</p>
            </div>
          `;
        } else {
          let html = `<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">`;
          
          state.absentTeachers.forEach(absentId => {
            const teacher = TEACHERS.find(t => t.id === absentId);
            const schedule = TIMETABLE[absentId][state.selectedDay] || [null,null,null,null,null,null,null];
            const initials = teacher.name.split(' ').map(n => n[0]).join('').substring(0, 2);
            
            // Material Card for Assignments
            html += `
              <div class="bg-white rounded-[24px] shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                  <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center font-bold text-lg shrink-0">
                      ${initials}
                    </div>
                    <div class="overflow-hidden">
                      <h3 class="font-medium text-base text-slate-800 truncate">${teacher.name}</h3>
                      <p class="text-sm text-slate-500 truncate max-w-[200px]">${teacher.subject}</p>
                    </div>
                  </div>
                </div>
                <div class="p-2 space-y-1">
            `;

            schedule.forEach((className, index) => {
              const isFree = className === null;
              const assignmentKey = `${state.selectedDay}-${absentId}-${index}`;
              const currentProxyId = state.assignments[assignmentKey] || '';
              const availableProxies = isFree ? [] : getAvailableProxies(state.selectedDay, index, absentId);

              html += `
                <div class="px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between rounded-[16px] hover:bg-slate-50 transition-colors gap-3 sm:gap-0">
                  <div class="flex items-center space-x-4 w-full sm:w-1/3">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-xs shrink-0">P${index + 1}</span>
                    ${isFree 
                      ? `<span class="text-sm text-slate-400 italic flex items-center"><i data-lucide="minus" class="w-4 h-4 mr-2"></i> Free</span>` 
                      : `<span class="font-medium text-slate-800 bg-blue-50 px-3 py-1.5 rounded-lg text-sm truncate w-full sm:w-auto" title="${className}">${className}</span>`
                    }
                  </div>
                  
                  <div class="flex-1 w-full sm:w-auto flex justify-start sm:justify-end">
                    ${isFree ? `<span class="text-sm text-slate-400 hidden sm:block px-3">No proxy needed</span>` : `
                      <div class="relative w-full sm:max-w-[240px]">
                        <select onchange="assignProxy(this, '${absentId}', ${index})" class="w-full appearance-none bg-slate-100 border-none text-slate-700 text-sm font-medium rounded-full focus:ring-2 focus:ring-blue-500 focus:bg-white block px-4 py-3 pr-10 cursor-pointer outline-none transition-all hover:bg-slate-200">
                          <option value="">Select proxy...</option>
                          ${availableProxies.map(proxy => `
                            <option value="${proxy.id}" ${proxy.id === currentProxyId ? 'selected' : ''}>
                              ${proxy.name}
                            </option>
                          `).join('')}
                          ${currentProxyId && !availableProxies.find(p => p.id === currentProxyId) ? `
                            <option value="${currentProxyId}" selected>${TEACHERS.find(t=>t.id===currentProxyId).name} (Selected)</option>
                          ` : ''}
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                          <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                      </div>
                    `}
                  </div>

                  <div class="hidden sm:flex w-8 justify-end">
                    ${currentProxyId && !isFree ? `<i data-lucide="check-circle-2" class="w-5 h-5 text-green-600"></i>` : ''}
                  </div>
                </div>
              `;
            });

            html += `</div></div>`;
          });
          html += `</div>`;
          container.innerHTML = html;
        }

      } else if (state.activeTab === 'summary') {
        const summaryData = generateSummaryData();
        
        if (summaryData.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-[24px] border border-slate-100 shadow-sm p-16 text-center text-slate-500 text-lg">
              No classes require coverage for ${state.selectedDay}.
            </div>
          `;
        } else {
          let html = `
            <div class="bg-white rounded-[24px] shadow-sm border border-slate-200 overflow-hidden print:border-none print:shadow-none">
              <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-600">
                  <thead class="text-xs text-slate-500 uppercase tracking-wider bg-slate-50 border-b border-slate-200 print:bg-white print:text-slate-800">
                    <tr>
                      <th class="px-6 py-5 font-medium whitespace-nowrap">Period</th>
                      <th class="px-6 py-5 font-medium whitespace-nowrap">Class</th>
                      <th class="px-6 py-5 font-medium min-w-[180px]">Absent Teacher</th>
                      <th class="px-6 py-5 font-medium min-w-[180px]">Assigned Proxy</th>
                      <th class="px-6 py-5 font-medium text-right whitespace-nowrap">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
          `;

          summaryData.forEach(row => {
            html += `
              <tr class="hover:bg-slate-50 transition-colors print:border-b print:border-slate-300 print:hover:bg-white print:break-inside-avoid">
                <td class="px-6 py-4 font-medium text-slate-800 whitespace-nowrap">Period ${row.period}</td>
                <td class="px-6 py-4 whitespace-nowrap"><span class="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-lg font-medium print:bg-transparent print:px-0 print:text-black">${row.className}</span></td>
                <td class="px-6 py-4">
                  <div class="flex flex-col">
                    <span class="font-medium text-slate-800">${row.absentTeacher.name}</span>
                    <span class="text-xs text-slate-500 mt-0.5 truncate max-w-[180px]">${row.absentTeacher.subject}</span>
                  </div>
                </td>
                <td class="px-6 py-4">
                  ${row.proxyTeacher ? `
                    <div class="flex flex-col">
                      <span class="font-medium text-blue-700 print:text-black">${row.proxyTeacher.name}</span>
                      <span class="text-xs text-blue-500 mt-0.5 print:text-slate-500 truncate max-w-[180px]">${row.proxyTeacher.subject}</span>
                    </div>
                  ` : `<span class="text-red-500 font-medium italic print:text-black">Unassigned</span>`}
                </td>
                <td class="px-6 py-4 text-right whitespace-nowrap">
                  ${row.status === 'Covered' ? `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700 print:bg-transparent print:text-black print:px-0 print:border-none">
                      <i data-lucide="check" class="w-3.5 h-3.5 mr-1.5 print:hidden"></i> Covered
                    </span>
                  ` : `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-100 print:bg-transparent print:text-black print:px-0 print:border-slate-400 print:rounded-none">
                      Pending
                    </span>
                  `}
                </td>
              </tr>
            `;
          });

          html += `</tbody></table></div></div>`;
          container.innerHTML = html;
        }
      }
      lucide.createIcons();
    }

    // --- MASTER RENDER FUNCTION ---
    function renderApp() {
      renderSidebar();
      renderTabsAndHeader();
      renderMainContent();
    }

    // --- INITIALIZE ---
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-fetch data when the page loads
      fetchData();
    });
  </script>
</body>
</html>
